services:
  db:
    image: postgres:16-alpine
    container_name: coffee-postgres
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: coffee_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      # PostgreSQL COPY가 CSV를 읽도록 읽기 전용으로 연결함
      - ./scripts/seed/catalog/csv:/seed/catalog:ro

  redis:
    image: redis:7-alpine
    container_name: coffee-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379" # 애플리케이션의 로컬 Redis 포트와 맞춘다.
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis-data:/data
