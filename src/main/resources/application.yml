spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # 기본 실행 환경
    group:
      dev: dev
      prod: prod
      test: test

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Seoul
jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

pg:
  toss:
    client-key: ${TOSS_WIDGET_CLIENT_KEY:${TOSS_CLIENT_KEY}}
    secret-key: ${TOSS_WIDGET_SECRET_KEY:${TOSS_SECRET_KEY}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

  delivery:
    base-fee: ${DELIVERY_BASE_FEE:3000}
    free-threshold: ${DELIVERY_FREE_THRESHOLD:30000}

  mileage:
    reward-rate-percent: ${MILEAGE_REWARD_RATE_PERCENT:1}
